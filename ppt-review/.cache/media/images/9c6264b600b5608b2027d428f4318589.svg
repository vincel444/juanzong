<svg width="430" height="280" viewBox="0 0 430 280" xmlns="http://www.w3.org/2000/svg"><text x="14" y="30" fill="#F1F5F9" font-size="17" font-weight="bold">流式输出时序</text><text x="14" y="62" fill="#94A3B8" font-size="13">深档 4B · 一整卷审阅</text><text x="14" y="104" fill="#94A3B8" font-size="14">思考流</text><rect x="78" y="88" width="330" height="24" rx="6" fill="rgba(59,130,246,0.30)" /><text x="92" y="105" fill="#94A3B8" font-size="13">推理可见、可折叠，随时能看懂它在想什么</text><text x="14" y="152" fill="#94A3B8" font-size="14">正文流</text><rect x="78" y="136" width="330" height="24" rx="6" fill="rgba(6,182,212,0.55)" /><path d="M78 168 v18 m-6 -8 l6 8 l6 -8" stroke="#06B6D4" stroke-width="2" fill="none" /><circle cx="78" cy="136" r="5" fill="#06B6D4" /><text x="92" y="196" fill="#06B6D4" font-size="13">首字 < 1s，边想边写，40s 任务不再黑屏</text><line x1="78" y1="216" x2="408" y2="216" stroke="#334155" stroke-width="1.5" /><text x="78" y="238" fill="#94A3B8" font-size="12">0s</text><text x="392" y="238" fill="#94A3B8" font-size="12">40s+</text><text x="14" y="268" fill="#94A3B8" font-size="13">轻档 / 中档：思考流极短，正文几乎立即开始</text></svg>